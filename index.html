<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROXY ANDROID 4.0 - Painel de Controle</title>

  <!-- Tags para transformar em App Instalável (PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#a855f7">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #030305;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .font-mono-custom {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Efeito de Fundo Neon e Luz Roxa */
    .bg-glow {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.25) 0%, rgba(126, 34, 206, 0.08) 50%, rgba(0,0,0,0) 80%);
      filter: blur(50px);
      pointer-events: none;
      z-index: 0;
    }

    .matrix-bg {
      position: fixed;
      inset: 0;
      opacity: 0.03;
      pointer-events: none;
      z-index: 0;
      font-family: monospace;
      font-size: 10px;
      color: #a855f7;
      word-break: break-all;
      line-height: 12px;
      user-select: none;
    }

    /* Gradient Text */
    .gradient-title-purple {
      background: linear-gradient(135deg, #a855f7 0%, #c084fc 50%, #e9d5ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Shake Animation para erro de senha */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }

    /* Transição suave Estilo iOS entre telas */
    .screen-transition {
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .screen-hidden {
      opacity: 0;
      transform: scale(0.95) translateY(10px);
      pointer-events: none;
      position: absolute;
      width: 100%;
    }

    .screen-visible {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
      position: relative;
    }
